<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
  <title id="title">Four venues, one evidence-first review workflow</title>
  <desc id="desc">CVPR retains behavioral simulation with optional careful reading. ICLR, ICML and NeurIPS default to careful reading, with their own reviewer lenses and scoring profiles. Reviewers map claims, inspect evidence, record uncertainty and explain their judgement. NeurIPS routes five contribution types to appropriate specialists.</desc>
  <rect width="1040" height="510" rx="24" fill="#0b1222"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="36" y="48" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="2">VENUE-AWARE REVIEW</text>
    <text x="36" y="88" fill="#f8fafc" font-size="30" font-weight="700">Different contributions. Appropriate scrutiny.</text>
    <g transform="translate(36 116)">
      <rect width="230" height="142" rx="14" fill="#13253a" stroke="#38bdf8"/>
      <rect width="230" height="5" rx="2" fill="#38bdf8"/>
      <text x="18" y="39" fill="#7dd3fc" font-size="24" font-weight="700">CVPR</text>
      <text x="18" y="67" fill="#f1f5f9" font-size="16">16 behavioral personas</text>
      <text x="18" y="96" fill="#cbd5e1" font-size="15">Reading habits + expertise</text>
      <text x="18" y="121" fill="#cbd5e1" font-size="15">Careful mode available</text>
    </g>
    <g transform="translate(282 116)">
      <rect width="230" height="142" rx="14" fill="#211d3c" stroke="#a78bfa"/>
      <rect width="230" height="5" rx="2" fill="#a78bfa"/>
      <text x="18" y="39" fill="#c4b5fd" font-size="24" font-weight="700">ICLR</text>
      <text x="18" y="67" fill="#f1f5f9" font-size="16">4 scientific lenses</text>
      <text x="18" y="96" fill="#cbd5e1" font-size="15">Knowledge + mechanisms</text>
      <text x="18" y="121" fill="#cbd5e1" font-size="15">Harness-defined rating</text>
    </g>
    <g transform="translate(528 116)">
      <rect width="230" height="142" rx="14" fill="#12302f" stroke="#2dd4bf"/>
      <rect width="230" height="5" rx="2" fill="#2dd4bf"/>
      <text x="18" y="39" fill="#5eead4" font-size="24" font-weight="700">ICML</text>
      <text x="18" y="67" fill="#f1f5f9" font-size="16">4 scientific lenses</text>
      <text x="18" y="96" fill="#cbd5e1" font-size="15">Soundness + significance</text>
      <text x="18" y="121" fill="#cbd5e1" font-size="15">Separate dimension scores</text>
    </g>
    <g transform="translate(774 116)">
      <rect width="230" height="142" rx="14" fill="#35271d" stroke="#fbbf24"/>
      <rect width="230" height="5" rx="2" fill="#fbbf24"/>
      <text x="18" y="39" fill="#fcd34d" font-size="24" font-weight="700">NeurIPS</text>
      <text x="18" y="67" fill="#f1f5f9" font-size="16">6 scientific lenses</text>
      <text x="18" y="96" fill="#cbd5e1" font-size="15">5 contribution types</text>
      <text x="18" y="121" fill="#cbd5e1" font-size="15">Specialist panel routing</text>
    </g>
    <text x="36" y="303" fill="#94a3b8" font-size="14" font-weight="700" letter-spacing="2">CAREFUL MODE · DEFAULT FOR THE NEW ML PROFILES</text>
    <path d="M76 357H957" stroke="#475569" stroke-width="2"/>
    <g fill="#0b1222" stroke="#64748b" stroke-width="2"><circle cx="76" cy="357" r="22"/><circle cx="322" cy="357" r="22"/><circle cx="568" cy="357" r="22"/><circle cx="814" cy="357" r="22"/></g>
    <g fill="#f8fafc" font-size="17" font-weight="700" text-anchor="middle"><text x="76" y="363">1</text><text x="322" y="363">2</text><text x="568" y="363">3</text><text x="814" y="363">4</text></g>
    <g fill="#f8fafc" font-size="19" font-weight="600"><text x="36" y="408">Map claims</text><text x="282" y="408">Inspect evidence</text><text x="528" y="408">Record uncertainty</text><text x="774" y="408">Explain judgement</text></g>
    <g fill="#94a3b8" font-size="14"><text x="36" y="434">Question, scope, assumptions</text><text x="282" y="434">Proofs, controls, figures</text><text x="528" y="434">Checked and unchecked</text><text x="774" y="434">Location, impact, remedy</text></g>
    <text x="36" y="483" fill="#94a3b8" font-size="14">Versioned profiles · Independent reviewers · Frozen session rules · Simulated feedback, not an acceptance forecast</text>
  </g>
</svg>
